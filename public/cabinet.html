<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Кабинет | Asking</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css?v=20260613-cabinet-v2-simple-restore-1" />
  </head>
  <body class="svdash-page">
    <header class="svdash-topbar">
      <a class="svdash-brand" href="/cabinet" aria-label="Кабинет Asking">
        <span class="svdash-brand__mark">A</span>
        <span>Asking</span>
      </a>
      <nav class="svdash-topnav" aria-label="Основная навигация">
        <a class="is-active" href="/cabinet">Кабинет</a>
        <a href="/create-v2">Конструктор</a>
        <a href="/account">Аккаунт</a>
        <a href="/guide">Справка</a>
      </nav>
      <div class="svdash-topbar__actions">
        <button id="refreshBtn" class="svdash-icon-btn" type="button" aria-label="Обновить список">↻</button>
        <button id="logoutBtn" class="svdash-btn svdash-btn--ghost" type="button">Выйти</button>
        <a class="svdash-btn svdash-btn--primary" href="/create-v2">Создать анкету</a>
      </div>
    </header>

    <main class="svdash-shell svdash-shell--surveys-first">
      <section class="svdash-panel svdash-panel--primary" aria-label="Мои анкеты">
        <div class="svdash-section-head svdash-section-head--split">
          <div>
            <span>Библиотека</span>
            <h2>Мои анкеты</h2>
          </div>
          <p id="resultsCount" class="svdash-results-count"></p>
        </div>

        <section class="svdash-filters" aria-label="Поиск и фильтры">
          <label class="svdash-search" for="searchInput">
            <span>Поиск анкет</span>
            <input id="searchInput" type="search" placeholder="Введите название или описание" />
          </label>
          <div class="svdash-filter-tabs" aria-label="Фильтр статуса">
            <button class="svdash-filter-tab is-active" type="button" data-status-chip="all">Все <span id="statActive">0</span></button>
            <button class="svdash-filter-tab" type="button" data-status-chip="draft">Черновики <span id="statDraft">0</span></button>
            <button class="svdash-filter-tab" type="button" data-status-chip="published">Опубликованные <span id="statPublished">0</span></button>
            <button class="svdash-filter-tab" type="button" data-status-chip="archived">Архив <span id="statArchived">0</span></button>
          </div>
          <label class="svdash-sort" for="sortSelect">
            <span>Сортировка</span>
            <select id="sortSelect">
              <option value="date">По дате</option>
              <option value="responses">По ответам</option>
              <option value="title">По названию</option>
            </select>
          </label>
          <select id="statusFilter" class="svdash-native-filter" aria-label="Статус">
            <option value="all">Все</option>
            <option value="draft">Черновики</option>
            <option value="published">Опубликованные</option>
            <option value="archived">Архив</option>
          </select>
        </section>

        <p id="cabinetStatusLine" class="svdash-status-line" aria-live="polite"></p>

        <section id="bulkBar" class="svdash-bulkbar" hidden>
          <div class="svdash-bulkbar__left">
            <strong id="bulkCount" class="svdash-bulkbar__count">0 выбрано</strong>
            <button id="selectAllFilteredBtn" class="svdash-btn svdash-btn--light svdash-btn--small" type="button">Выбрать все</button>
            <button id="clearSelectionBtn" class="svdash-btn svdash-btn--light svdash-btn--small" type="button">Снять выделение</button>
          </div>
          <div class="svdash-bulkbar__right">
            <button id="bulkPublishBtn" class="svdash-btn svdash-btn--light svdash-btn--small" type="button">Опубликовать</button>
            <button id="bulkArchiveBtn" class="svdash-btn svdash-btn--light svdash-btn--small" type="button">Архивировать</button>
            <button id="bulkDeleteBtn" class="svdash-btn svdash-btn--danger svdash-btn--small" type="button">Удалить</button>
          </div>
        </section>

        <section id="surveysGrid" class="svdash-grid"></section>

        <section id="emptyState" class="svdash-empty" hidden>
          <div class="svdash-empty__art" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </div>
          <h3>Здесь пока нет анкет</h3>
          <p>Создайте первую анкету, чтобы начать сбор ответов</p>
          <a class="svdash-btn svdash-btn--primary" href="/create-v2">Создать анкету</a>
        </section>
      </section>

      <section class="svdash-activity" aria-label="Последняя активность">
        <div class="svdash-section-head">
          <div>
            <span>События</span>
            <h2>Последняя активность</h2>
          </div>
        </div>
        <div id="activityList" class="svdash-activity-list"></div>
      </section>
    </main>

    <div id="qrModal" class="modal" hidden>
      <div class="modal__content modal__content--compact">
        <button id="qrModalClose" class="modal__close" type="button" aria-label="Закрыть">×</button>
        <h3>QR-код ссылки</h3>
        <p class="lead" id="qrLinkText"></p>
        <div class="qr-box"><img id="qrImage" alt="QR" /></div>
        <div class="modal-actions">
          <a id="qrOpenLink" class="svdash-btn svdash-btn--light" target="_blank" rel="noopener">Открыть ссылку</a>
          <a id="qrDownloadLink" class="svdash-btn svdash-btn--primary" download="survey-qr.png">Скачать PNG</a>
        </div>
      </div>
    </div>

    <div id="confirmModal" class="modal" hidden>
      <div class="modal__content modal__content--compact">
        <h3 id="confirmTitle">Подтвердите действие</h3>
        <p id="confirmText" class="lead"></p>
        <div class="modal-actions">
          <button id="confirmCancel" class="svdash-btn svdash-btn--light" type="button">Отмена</button>
          <button id="confirmSubmit" class="svdash-btn svdash-btn--danger" type="button">Подтвердить</button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast" hidden></div>

    <script src="/lang.js?v=20260429-1"></script>
    <script src="/cabinet.js?v=20260613-cabinet-v2-simple-restore-1"></script>
  </body>
</html>
